services:
  wa-sticker-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: wa-sticker-bot

    restart: unless-stopped

    shm_size: "512m"

    environment:
      NODE_ENV: production
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

    volumes:
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./temp:/app/temp
      - ./data:/app/data
      - ./src:/app/src

    mem_limit: 1536m
    memswap_limit: 2048m
    cpus: 1.5
    pids_limit: 250

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
